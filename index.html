<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKILL STANIS - Network Dashboard</title>
    <style>
        body { 
            background-color: #030a16; /* Deep Server Blue */
            color: #a0aec0; 
            font-family: 'Consolas', 'Segoe UI', monospace; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        /* Canvas Background Interaktif */
        #network-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; }
        
        /* Efek Vignette agar tengah lebih terang dan pinggir gelap */
        .overlay { position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, #030a16 90%); z-index: -1; pointer-events: none; }
        
        /* Bagian Atas (Header) */
        .header { display: flex; justify-content: space-between; padding: 30px 40px; z-index: 10; }
        .title-box { border-left: 4px solid #00ff88; background: rgba(3, 10, 22, 0.85); padding: 15px 30px; border-radius: 0 12px 12px 0; box-shadow: 10px 0 20px rgba(0, 255, 136, 0.05); backdrop-filter: blur(8px); }
        .title-box h1 { margin: 0; color: #00e5ff; font-size: 26px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,229,255,0.4); font-family: 'Segoe UI', sans-serif; }
        .title-box p { margin: 5px 0 0; color: #00ff88; font-size: 12px; letter-spacing: 2px; font-weight: bold; }
        
        .stats-box { border-right: 4px solid #00e5ff; background: rgba(3, 10, 22, 0.85); padding: 10px 25px; border-radius: 12px 0 0 12px; display: flex; align-items: center; gap: 20px; backdrop-filter: blur(8px); }
        .stats-text { display: flex; flex-direction: column; align-items: flex-end; }
        .stats-text span { font-size: 11px; color: #718096; letter-spacing: 1px; }
        .stats-text strong { font-size: 24px; color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.3); font-family: 'Segoe UI', sans-serif;}
        .progress-ring { width: 45px; height: 45px; border-radius: 50%; background: conic-gradient(#00e5ff 0%, #1a202c 0%); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0,229,255,0.2); }
        .progress-ring::before { content: ''; width: 35px; height: 35px; background: #030a16; border-radius: 50%; }

        /* Area Main */
        .main-area { flex: 1; display: flex; flex-direction: column; padding: 0 50px; overflow-y: auto; position: relative; z-index: 1; scrollbar-width: none; }
        .main-area::-webkit-scrollbar { display: none; }
        
        /* Zona */
        .zone { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 20px; padding: 20px 0; }
        .zone-title { width: 100%; text-align: center; font-size: 14px; letter-spacing: 5px; color: #00ff88; margin-bottom: 20px; font-weight: bold; text-shadow: 0 0 10px rgba(0,255,136,0.3); font-family: 'Segoe UI', sans-serif;}

        /* Kapsul Skill */
        .capsule { padding: 12px 22px; border-radius: 8px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); user-select: none; background: rgba(10, 15, 30, 0.9); border: 1px solid #1e293b; backdrop-filter: blur(5px); border-left: 3px solid #475569; }
        .capsule:hover { border-color: #00e5ff; transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.4); border-left: 3px solid #00e5ff; }
        .capsule-info { display: flex; flex-direction: column; gap: 5px; font-family: 'Segoe UI', sans-serif; flex: 1; }
        .capsule .name { font-size: 14px; font-weight: bold; color: #e2e8f0; transition: 0.3s; }
        .capsule .tag { font-size: 10px; color: #64748b; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s; }
        .capsule .close-btn { background: rgba(255,255,255,0.05); border: none; color: #64748b; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 12px; transition: 0.2s; }
        .capsule .close-btn:hover { background: #ff3366; color: white; box-shadow: 0 0 10px rgba(255,51,102,0.5); }

        /* Mode Goals / Mastered */
        .capsule.mastered { border-color: #00ff88; background: rgba(0, 255, 136, 0.05); border-left: 3px solid #00ff88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.1); animation: float 4s ease-in-out infinite; }
        .capsule.mastered .name { color: #00ff88; text-shadow: 0 0 5px rgba(0,255,136,0.3); }
        .capsule.mastered .tag { color: #00e5ff; }
        .capsule.mastered .close-btn { color: #00ff88; }
        .capsule.mastered:hover { box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }

        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0); } }

        /* Bagian Bawah (Input) */
        .footer { background: rgba(3, 10, 22, 0.95); border-top: 1px solid rgba(0, 229, 255, 0.2); padding: 25px 40px; display: flex; justify-content: center; gap: 15px; z-index: 10; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(10px); font-family: 'Segoe UI', sans-serif;}
        .footer input { background: #0a0f1e; border: 1px solid #1e293b; color: #00e5ff; padding: 12px 20px; border-radius: 6px; width: 400px; outline: none; transition: 0.3s; font-family: 'Consolas', monospace; font-size: 14px; }
        .footer input::placeholder { color: #475569; }
        .footer input:focus { border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,0.15); }
        .footer select { background: #0a0f1e; border: 1px solid #1e293b; color: white; padding: 12px 20px; border-radius: 6px; outline: none; cursor: pointer; font-family: 'Segoe UI', sans-serif;}
        .footer button { background: #00e5ff; border: none; color: #030a16; padding: 12px 35px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
        .footer button:hover { background: #00ff88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); }

        /* TWEAKS KHUSUS AGAR RAPI DI HP (TIDAK MENGUBAH BACKGROUND) */
        @media (max-width: 768px) {
            .header { flex-direction: column; padding: 15px; gap: 15px; align-items: stretch; }
            .title-box { border-left: none; border-bottom: 3px solid #00ff88; border-radius: 12px 12px 0 0; text-align: center; padding: 15px; }
            .stats-box { border-right: none; border-top: 3px solid #00e5ff; border-radius: 0 0 12px 12px; justify-content: center; padding: 15px; }
            .stats-text { align-items: center; }
            
            .main-area { padding: 0 15px; }
            .capsule { width: 100%; box-sizing: border-box; justify-content: space-between; }
            
            .footer { flex-direction: column; padding: 15px; gap: 10px; }
            .footer input, .footer select, .footer button { width: 100%; box-sizing: border-box; }
            .footer button { padding: 15px; }
        }
    </style>
</head>
<body>
    <canvas id="network-canvas"></canvas>
    <div class="overlay"></div>
    
    <div class="header">
        <div class="title-box">
            <h1>SKILL STANIS</h1>
            <p>NETWORK ARCHITECTURE</p>
        </div>
        <div class="stats-box">
            <div class="stats-text">
                <span>SYSTEM LINKED</span>
                <strong id="progress-text">0%</strong>
            </div>
            <div class="progress-ring" id="progress-ring"></div>
        </div>
    </div>

    <div class="main-area">
        <div class="zone" id="mastery-zone">
            <div class="zone-title">[ STANIS GOALS ]</div>
        </div>
        
        <div class="zone" id="learning-zone" style="margin-top: auto; padding-bottom: 20px;">
        </div>
    </div>

    <div class="footer">
        <input type="text" id="skill-input" placeholder="> Add new network node or protocol...">
        <select id="skill-type">
            <option value="hard">Hard Skill</option>
            <option value="soft">Soft Skill</option>
        </select>
        <button onclick="addSkill()">CONNECT</button>
    </div>

    <script>
        /* === BACKGROUND INTERAKTIF (VERSI ORIGINAL YANG LU SUKA) === */
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let nodes = [];
        let mouse = { x: null, y: null };

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initNodes();
        }
        window.addEventListener('resize', resizeCanvas);

        // Input Mouse (Laptop)
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        
        // Input Touch (HP) supaya latar belakangnya juga ngerespons jari
        window.addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

        class NetworkNode {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > width) this.speedX *= -1;
                if (this.y < 0 || this.y > height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = '#00e5ff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Kepadatan titik (node) kembali 100% seperti versi awal
        function initNodes() {
            nodes = [];
            let numberOfNodes = (width * height) / 12000; 
            for (let i = 0; i < numberOfNodes; i++) {
                nodes.push(new NetworkNode());
            }
        }
        resizeCanvas();

        function animateNetwork() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < nodes.length; i++) {
                nodes[i].update();
                nodes[i].draw();
                
                for (let j = i; j < nodes.length; j++) {
                    let dx = nodes[i].x - nodes[j].x;
                    let dy = nodes[i].y - nodes[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 130) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 229, 255, ${0.15 - distance/866})`;
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }

                // Efek kursor (Mouse/Jari) kembali ke radius 180 (lebih responsif)
                if (mouse.x != null) {
                    let mdx = nodes[i].x - mouse.x;
                    let mdy = nodes[i].y - mouse.y;
                    let mDistance = Math.sqrt(mdx * mdx + mdy * mdy);
                    
                    if (mDistance < 180) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 255, 136, ${0.4 - mDistance/450})`;
                        ctx.lineWidth = 1.2;
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                        
                        nodes[i].x -= mdx * 0.005;
                        nodes[i].y -= mdy * 0.005;
                    }
                }
            }
            requestAnimationFrame(animateNetwork);
        }
        animateNetwork();


        /* === LOGIKA SKILL TRACKER === */
        // Mengganti nama key local storage biar aman dari sisa memori versi lama
        let skills = JSON.parse(localStorage.getItem('stanis_network_v6')) || [
            { id: 1, name: 'TCP/IP & Subnetting', type: 'hard', mastered: false },
            { id: 2, name: 'Routing (OSPF, BGP)', type: 'hard', mastered: false },
            { id: 3, name: 'Switching (VLAN)', type: 'hard', mastered: false },
            { id: 4, name: 'Load Balancing', type: 'hard', mastered: false },
            { id: 5, name: 'Virtualization & Cloud', type: 'hard', mastered: false },
            { id: 6, name: 'Python Fundamentals', type: 'hard', mastered: false },
            { id: 7, name: 'Logical Troubleshooting', type: 'soft', mastered: false },
            { id: 8, name: 'Technical Communication', type: 'soft', mastered: false },
            { id: 9, name: 'Adaptability', type: 'soft', mastered: false },
            { id: 10, name: 'Time Management', type: 'soft', mastered: false }
        ];

        function saveSkills() { localStorage.setItem('stanis_network_v6', JSON.stringify(skills)); }

        function renderSkills() {
            const learningZone = document.getElementById('learning-zone');
            const masteryZone = document.getElementById('mastery-zone');
            
            learningZone.innerHTML = ''; 
            masteryZone.innerHTML = '<div class="zone-title">[ STANIS GOALS ]</div>';

            let masteredCount = 0;

            skills.forEach(skill => {
                const capsule = document.createElement('div');
                capsule.className = `capsule ${skill.mastered ? 'mastered' : ''}`;
                
                capsule.innerHTML = `
                    <div class="capsule-info" onclick="toggleSkill(${skill.id})">
                        <div class="name">${skill.name}</div>
                        <div class="tag">${skill.type} Protocol</div>
                    </div>
                    <button class="close-btn" onclick="deleteSkill(${skill.id}, event)">✕</button>
                `;

                if (skill.mastered) {
                    masteryZone.appendChild(capsule);
                    masteredCount++;
                } else {
                    learningZone.appendChild(capsule);
                }
            });

            updateProgress(masteredCount, skills.length);
        }

        function toggleSkill(id) {
            const skill = skills.find(s => s.id === id);
            if (skill) {
                skill.mastered = !skill.mastered;
                saveSkills();
                renderSkills();
            }
        }

        function deleteSkill(id, event) {
            event.stopPropagation();
            skills = skills.filter(s => s.id !== id);
            saveSkills();
            renderSkills();
        }

        function addSkill() {
            const input = document.getElementById('skill-input');
            const type = document.getElementById('skill-type');
            if (input.value.trim() === '') return;

            skills.push({
                id: Date.now(),
                name: input.value.trim(),
                type: type.value,
                mastered: false
            });
            saveSkills();
            input.value = '';
            renderSkills();
        }

        function updateProgress(mastered, total) {
            const ring = document.getElementById('progress-ring');
            const text = document.getElementById('progress-text');
            if (total === 0) {
                ring.style.background = `conic-gradient(#1a202c 100%, #1a202c 0%)`;
                text.innerText = '0%';
                return;
            }
            const percentage = Math.round((mastered / total) * 100);
            ring.style.background = `conic-gradient(#00e5ff ${percentage}%, #1a202c ${percentage}%)`;
            text.innerText = `${percentage}%`;
        }

        document.getElementById('skill-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') addSkill();
        });

        renderSkills();
    </script>
</body>
</html>
